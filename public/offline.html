<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#102c31" />
  <title>آفلاین — امضاگیر</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f3ed;color:#102c31;font-family:Vazirmatn,Tahoma,sans-serif;padding:24px;text-align:center}
    .box{max-width:380px}
    .ic{width:72px;height:72px;border-radius:22px;background:#102c31;color:#41e4ad;display:grid;place-items:center;margin:0 auto 20px;font-size:34px}
    h1{font-size:22px;margin:0 0 10px}
    p{font-size:13px;line-height:2;color:#536365;margin:0 0 22px}
    button{background:#102c31;color:#fff;border:0;border-radius:13px;min-height:46px;padding:0 24px;font:inherit;font-weight:700;cursor:pointer}
  </style>
</head>
<body>
  <main class="box">
    <div class="ic" aria-hidden="true">⌁</div>
    <h1>اتصال اینترنت برقرار نیست</h1>
    <p>برای حفظ امنیت قراردادها، اطلاعات شما روی دستگاه ذخیره نمی‌شود. به‌محض اتصال دوباره به اینترنت، ادامه دهید.</p>
    <button onclick="location.reload()">تلاش دوباره</button>
  </main>
</body>
</html>
